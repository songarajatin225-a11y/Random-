<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Editor — Raksha Bandhan</title>
<style>
  :root{
    --ink:#14060B; --maroon:#2A0812; --panel:#3D0D1B; --line:rgba(220,192,122,.22);
    --cream:#F6EADA; --gold:#DCC07A; --rose:#C98A94; --ok:#6FBF8B; --bad:#E4788A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--cream);
       font:400 15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  a{color:var(--gold)}
  .wrap{max-width:60rem;margin:0 auto;padding:1.5rem 1.25rem 6rem}
  h1{font-size:1.35rem;margin:0;font-weight:600;letter-spacing:-.01em}
  h2{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
     margin:2.5rem 0 .9rem;font-weight:600}
  label{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
        color:rgba(246,234,218,.55);margin:0 0 .35rem}
  input[type=text],input[type=password],textarea,select{
    width:100%;padding:.6rem .75rem;border-radius:.55rem;border:1px solid var(--line);
    background:rgba(255,240,225,.05);color:var(--cream);font:inherit;font-size:.92rem}
  textarea{resize:vertical;min-height:4.5rem}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
  .field{margin-bottom:1rem}
  .row{display:grid;gap:.75rem}
  @media(min-width:640px){.row.two{grid-template-columns:1fr 1fr}}
  .card{border:1px solid var(--line);background:rgba(255,240,225,.03);
        border-radius:.85rem;padding:1rem;margin-bottom:.85rem}
  button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);
         background:transparent;color:var(--cream);padding:.5rem 1rem;font-size:.85rem}
  button:hover{background:rgba(220,192,122,.1)}
  button.primary{background:linear-gradient(135deg,#EBDCAE,#C9A227);color:#2A0812;
                 border:none;font-weight:600;padding:.65rem 1.5rem}
  button.danger{border-color:rgba(228,120,138,.4);color:var(--bad)}
  button.tiny{padding:.25rem .6rem;font-size:.75rem}
  .bar{position:sticky;top:0;z-index:5;background:rgba(20,6,11,.94);
       backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
       padding:.85rem 1.25rem;display:flex;gap:.75rem;align-items:center;justify-content:space-between}
  .bar .grp{display:flex;gap:.6rem;align-items:center}
  .muted{color:rgba(246,234,218,.5);font-size:.8rem}
  .list-item{display:flex;gap:.6rem;align-items:flex-start;margin-bottom:.5rem}
  .list-item textarea{flex:1;min-height:3.2rem}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:.6rem}
  .thumb{position:relative;border:1px solid var(--line);border-radius:.6rem;overflow:hidden;
         aspect-ratio:4/3;background:var(--panel);cursor:pointer}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb.sel{outline:2px solid var(--gold);outline-offset:1px}
  .thumb .x{position:absolute;top:.25rem;right:.25rem;background:rgba(20,6,11,.85);
            border-radius:999px;padding:.1rem .45rem;font-size:.7rem;color:var(--bad)}
  .mem{display:grid;gap:.75rem;grid-template-columns:7rem 1fr;align-items:start}
  .mem .pic{border:1px solid var(--line);border-radius:.6rem;overflow:hidden;aspect-ratio:4/3;
            background:var(--panel);display:grid;place-items:center;font-size:.65rem;
            color:rgba(246,234,218,.4);text-align:center;padding:.3rem;cursor:pointer}
  .mem .pic img{width:100%;height:100%;object-fit:cover}
  dialog{border:1px solid var(--line);border-radius:1rem;background:var(--maroon);
         color:var(--cream);max-width:44rem;width:92vw;padding:1.25rem}
  dialog::backdrop{background:rgba(10,3,6,.8)}
  .toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);z-index:20;
         padding:.7rem 1.4rem;border-radius:999px;font-size:.88rem;
         background:var(--panel);border:1px solid var(--line);opacity:0;
         transition:opacity .25s,transform .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .toast.ok{border-color:rgba(111,191,139,.5);color:var(--ok)}
  .toast.err{border-color:rgba(228,120,138,.5);color:var(--bad)}
  .login{max-width:22rem;margin:18vh auto;text-align:center}
  .login p{color:rgba(246,234,218,.6);font-size:.9rem}
  .hide{display:none !important}
</style>
</head>
<body>

<div id="login" class="login">
  <h1>Editor</h1>
  <p>Enter the password to edit the site.</p>
  <form id="loginForm">
    <div class="field"><input type="password" id="password" autocomplete="current-password"
      placeholder="Password" required /></div>
    <button class="primary" type="submit">Sign in</button>
  </form>
  <p id="loginError" class="muted" style="color:var(--bad)"></p>
</div>

<div id="app" class="hide">
  <div class="bar">
    <div class="grp"><h1>Editor</h1><span id="dirty" class="muted"></span></div>
    <div class="grp">
      <a href="../" target="_blank" class="muted">View site ↗</a>
      <button id="logout">Sign out</button>
      <button id="save" class="primary">Save changes</button>
    </div>
  </div>
  <div class="wrap"><form id="editor"></form></div>
</div>

<dialog id="picker">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem">
    <strong>Choose a photo</strong>
    <div class="grp">
      <label for="uploadInput" style="margin:0">
        <span class="tiny" style="border:1px solid var(--line);border-radius:999px;
              padding:.4rem .9rem;display:inline-block;cursor:pointer;text-transform:none;
              letter-spacing:0;font-size:.82rem;color:var(--cream)">Upload photos</span>
      </label>
      <input type="file" id="uploadInput" accept="image/*" multiple class="hide" />
      <button type="button" id="closePicker">Close</button>
    </div>
  </div>
  <p class="muted" id="pickerHint">JPG, PNG, WebP or GIF · up to 8MB each</p>
  <div class="thumbs" id="pickerGrid"></div>
</dialog>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
